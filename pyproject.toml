[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TraceBFB"
version = "0.0.1"
description = "A framework for BFB cycle simulation and inference"
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["pysam"]

[project.scripts]
tracebfb = "tracebfb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]